services:
  - type: web
    name: smartphone-addiction-api
    env: python
    plan: free                      # <--- Add this line!
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9